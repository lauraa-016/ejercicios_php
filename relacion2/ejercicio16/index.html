
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números primos y divisores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="mb-4">Primos y divisores</h1>

        <form id="formulario" action="calcular.php" method="POST">

            <div class="mb-3">

                <label for="numero" class="form-label">Número entero positivo</label>

                <input type="number" class="form-control"
                       id="numero" name="numero">

            </div>

            <p>Selecciona una operación:</p>

            <div class="form-check mb-2">

                <input class="form-check-input" type="radio"
                       id="primo" name="operacion" value="primo">

                <label class="form-check-label" for="primo">
                    Comprobar si es primo
                </label>

            </div>

            <div class="form-check mb-3">

                <input class="form-check-input" type="radio"
                       id="divisores" name="operacion" value="divisores">

                <label class="form-check-label" for="divisores">
                    Mostrar divisores
                </label>

            </div>

            <p id="mensaje" class="text-danger"></p>

            <button type="submit" class="btn btn-primary">
                Ejecutar
            </button>

        </form>

    </div>

    <script>

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            const numero = document.getElementById("numero").value.trim();

            const operacion = document.querySelector('input[name="operacion"]:checked');

            let errores = [];

            if (numero == "" || isNaN(numero) || !Number.isInteger(Number(numero)) || numero < 1) {

                errores.push("Introduce un número entero positivo.");

            }

            if (operacion == null) {

                errores.push("Selecciona una operación.");

            }

            if (errores.length > 0) {

                event.preventDefault();

                document.getElementById("mensaje").innerHTML = errores.join("<br>");

            }

        });

    </script>

</body>
</html>
