<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calificación final</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Cálculo de calificación</h1>

        <form action="calcular.php" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>

                <input type="text" class="form-control" id="nombre" name="nombre" required />
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>

                <input type="email" class="form-control" id="correo" name="correo" required />
            </div>

            <div class="mb-3">
                <label for="inicial" class="form-label">Nota inicial (10 %)</label>

                <input type="number" class="form-control" id="inicial" name="inicial" min="0" max="10" step="0.01"
                    required />
            </div>

            <div class="mb-3">
                <label for="primera" class="form-label">Primera nota (20 %)</label>

                <input type="number" class="form-control" id="primera" name="primera" min="0" max="10" step="0.01"
                    required />
            </div>

            <div class="mb-3">
                <label for="segunda" class="form-label">Segunda nota (30 %)</label>

                <input type="number" class="form-control" id="segunda" name="segunda" min="0" max="10" step="0.01"
                    required />
            </div>

            <div class="mb-3">
                <label for="tercera" class="form-label">Tercera nota (40 %)</label>

                <input type="number" class="form-control" id="tercera" name="tercera" min="0" max="10" step="0.01"
                    required />
            </div>

            <button type="submit" class="btn btn-primary">
                Calcular calificación
            </button>
        </form>
    </div>
</body>

</html>
