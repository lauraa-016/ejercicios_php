
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="mb-4">Clasificación de notas</h1>

        <form id="formulario" action="calcular.php" method="POST">

            <div class="mb-3">

                <label for="nota" class="form-label">Introduce una nota</label>

                <input type="number" class="form-control"
                       id="nota" name="nota">

            </div>

            <p id="mensaje" class="text-danger"></p>

            <button type="submit" class="btn btn-primary">
                Calcular
            </button>

        </form>

    </div>

    <script>

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            const nota = document.getElementById("nota").value.trim();

            const mensaje = document.getElementById("mensaje");

            if (nota == "" || isNaN(nota) || !Number.isInteger(Number(nota)) || nota < 1 || nota > 10) {

                event.preventDefault();

                mensaje.textContent = "Introduce un número entero entre 1 y 10.";

            }

        });

    </script>

</body>
</html>
