<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nota final</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Cálculo de nota final</h1>

        <form action="calcular.php" method="POST">
            <div class="mb-3">
                <label for="nota1" class="form-label">Primera nota</label>

                <input type="number" class="form-control" id="nota1" name="nota1" min="0" max="10" step="0.01"
                    required />
            </div>

            <div class="mb-3">
                <label for="nota2" class="form-label">Segunda nota</label>

                <input type="number" class="form-control" id="nota2" name="nota2" min="0" max="10" step="0.01"
                    required />
            </div>

            <div class="mb-3">
                <label for="faltas" class="form-label">Faltas sin justificar</label>

                <input type="number" class="form-control" id="faltas" name="faltas" min="0" step="1" required />
            </div>

            <button type="submit" class="btn btn-primary">Calcular nota</button>
        </form>
    </div>
</body>

</html>
