
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="mb-4">Calculadora</h1>

        <form action="calcular-calculadora.php" method="POST">

            <div class="mb-3">

                <label for="numero1" class="form-label">
                    Primer número
                </label>

                <input type="number" class="form-control"
                       id="numero1" name="numero1" required>

            </div>

            <div class="mb-3">

                <label for="numero2" class="form-label">
                    Segundo número
                </label>

                <input type="number" class="form-control"
                       id="numero2" name="numero2" required>

            </div>

            <div class="mb-3">

                <label for="operador" class="form-label">
                    Selecciona operación
                </label>

                <select class="form-select" id="operador" name="operador" required>

                    <option value="0" selected disabled>
                        Selecciona operación
                    </option>

                    <option value="+">Suma (+)</option>

                    <option value="-">Resta (-)</option>

                    <option value="*">Multiplicación (*)</option>

                    <option value="/">División (/)</option>

                    <option value="%">Módulo (%)</option>

                </select>

            </div>

            <button type="submit" class="btn btn-primary">
                Calcular
            </button>

        </form>

    </div>

</body>
</html>
