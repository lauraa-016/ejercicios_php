
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones con JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="mb-4">Cálculo de calificación</h1>

        <form id="formulario" action="calcular.php" method="POST">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre">
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="text" class="form-control" id="correo" name="correo">
            </div>

            <div class="mb-3">
                <label for="inicial" class="form-label">Nota inicial (10 %)</label>
                <input type="number" class="form-control" id="inicial" name="inicial">
            </div>

            <div class="mb-3">
                <label for="primera" class="form-label">Primera nota (20 %)</label>
                <input type="number" class="form-control" id="primera" name="primera">
            </div>

            <div class="mb-3">
                <label for="segunda" class="form-label">Segunda nota (30 %)</label>
                <input type="number" class="form-control" id="segunda" name="segunda">
            </div>

            <div class="mb-3">
                <label for="tercera" class="form-label">Tercera nota (40 %)</label>
                <input type="number" class="form-control" id="tercera" name="tercera">
            </div>

            <p id="mensaje" class="text-danger"></p>

            <button type="submit" class="btn btn-primary">
                Calcular
            </button>

        </form>

    </div>

    <script>

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            let errores = [];

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();

            const notas = [
                document.getElementById("inicial").value.trim(),
                document.getElementById("primera").value.trim(),
                document.getElementById("segunda").value.trim(),
                document.getElementById("tercera").value.trim()
            ];

            if (nombre == "") {
                errores.push("El nombre es obligatorio.");
            }

            if (correo == "" || !correo.includes("@") || !correo.includes(".")) {
                errores.push("Introduce un correo electrónico válido.");
            }

            for (let i = 0; i < notas.length; i++) {

                if (notas[i] == "") {

                    errores.push("Todas las notas son obligatorias.");

                } else if (isNaN(notas[i]) || notas[i] < 0 || notas[i] > 10) {

                    errores.push("Las notas deben ser números entre 0 y 10.");

                }

            }

            if (errores.length > 0) {

                event.preventDefault();

                document.getElementById("mensaje").innerHTML = errores.join("<br>");

            }

        });

    </script>

</body>
</html>
